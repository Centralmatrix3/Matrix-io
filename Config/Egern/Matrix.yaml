# [分流规则]
rules:
  - rule_set:
      name: 规则修正
      match: https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Ruleset/Egern/Unbreak.yaml
      policy: DIRECT
      update_interval: 86400
      disabled: false

  - rule_set:
      name: 广告拦截
      match: https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Ruleset/Egern/Advertising.yaml
      policy: REJECT
      update_interval: 86400
      disabled: false

  - rule_set:
      name: 谷歌服务
      match: https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Ruleset/Egern/Google.yaml
      policy: 谷歌服务
      update_interval: 86400
      disabled: false

  - rule_set:
      name: 国外媒体
      match: https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Ruleset/Egern/GlobalMedia.yaml
      policy: 国外媒体
      update_interval: 86400
      disabled: false

  - rule_set:
      name: 国内媒体
      match: https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Ruleset/Egern/ChinaMedia.yaml
      policy: 国内媒体
      update_interval: 86400
      disabled: false

  - rule_set:
      name: 国外网站
      match: https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Ruleset/Egern/Global.yaml
      policy: 国外网站
      update_interval: 86400
      disabled: false

  - rule_set:
      name: 苹果服务
      match: https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Ruleset/Egern/Apple.yaml
      policy: 苹果服务
      update_interval: 86400
      disabled: false

  - rule_set:
      name: 局域网络
      match: https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Ruleset/Egern/LAN.yaml
      policy: DIRECT
      update_interval: 86400
      disabled: false

  - rule_set:
      name: 国内网站
      match: https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Ruleset/Egern/GEOIPCN.yaml
      policy: DIRECT
      update_interval: 86400
      disabled: false

  - default:
      name: 黑白名单
      policy: 黑白名单

# [MITM]
mitm:
  hostnames:
    excludes:
      - buy.itunes.apple.com
 