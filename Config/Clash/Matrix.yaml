# 配置名称: Clash配置
# 配置作者: Centralmatrix3
# 更新时间: 26-09-05 00:00

# [订阅节点]
proxy-providers:
  subscribe:
    type: http
    url: "https://your-service-provider"
    interval: 86400
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 1800
      timeout: 5000

# [通用设置]
mixed-port: 7893
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
geodata-mode: false
geox-url:
  mmdb: "https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country.mmdb"
profile:
  store-selected: true
  store-fake-ip: true

# [DNS设置]
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fake-ip-filter:
    - '*.lan'
    - '*.local'

# [TUN设置]
tun:
  enable: true
  stack: mixed
  dns-hijack: [any:53]

# [嗅探设置]
sniffer:
  enable: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

# [策略组]
proxy-groups:
  - name: "自行选择"
    type: select
    icon: https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Gallery/Color/Static.png
    url: "https://cp.cloudflare.com/generate_204"
    include-all: true
    filter: "^"
    interval: 1800
    lazy: true

  - name: "自动选择"
    type: url-test
    icon: https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Gallery/Color/Available.png
